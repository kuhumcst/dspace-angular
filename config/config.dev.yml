# Development environment configuration
# This file overrides config.yml settings when NODE_ENV=development
# Note: Environment variables from .env.local take precedence over these settings

# Enable debug mode (logs Redux actions and state changes)
debug: true

# Angular Universal server settings (overridden by .env.local)
ui:
  ssl: false
  host: localhost
  port: 4000
  nameSpace: /

# DSpace REST API endpoint (overridden by .env.local)
rest:
  ssl: false
  host: localhost
  port: 8080
  nameSpace: /server

# Disable inline critical CSS in dev (faster server-side rendering)
universal:
  inlineCriticalCss: false

# Shorter cache times for development
cache:
  msToLive:
    default: 60000 # 1 minute (vs 15 minutes in production)

  # Disable server-side caching for development
  # This ensures you always see fresh content
  serverSide:
    debug: true  # Show cache hits/misses in console
    botCache:
      max: 0  # Disable bot cache
    anonymousCache:
      max: 0  # Disable anonymous cache

# Show detailed logs for authentication (helpful for debugging)
log:
  # Add any logging configuration here if needed
  level: debug
