# CLARIN-DK DSpace 7 Frontend Production Configuration

rest:
  ssl: true
  host: dspace.clarin.dk
  port: 443
  nameSpace: /server

ui:
  ssl: true
  host: dspace.clarin.dk
  port: 443
  nameSpace: /

# Languages: Danish is inactive until da.json5 translation file is created
# (see CLARIN-DK-CUSTOMIZATION.md).  English is the sole active language for now.
languages:
  - code: en
    label: English
    active: true
  - code: da
    label: Dansk
    active: false
  - code: cs
    label: Ceština
    active: false
